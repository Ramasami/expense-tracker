name: Release Budget Tracker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm test
      - name: Determine release version
        run: echo "BUDGET_APP_VERSION=$(node scripts/release-version.mjs)" >> "$GITHUB_ENV"
      - name: Build release site
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.BUDGET_APP_VERSION }}
          COMMIT: ${{ github.sha }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          ARCHIVE="budget-tracker-${VERSION}.zip"
          (cd out && zip -qr "../${ARCHIVE}" .)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; keeping the original assets."
          else
            gh release create "$VERSION" "$ARCHIVE" --target "$COMMIT" --title "Budget Tracker $VERSION" --generate-notes
          fi
